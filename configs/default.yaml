# Параметры пайплайна. Все пороги вынесены сюда; в коде «магических» чисел нет.
# Значения по умолчанию выведены из физики съёмки и из шкал, приведённых в постановке
# кейса (рис. 6 — пороги эталонной разметки dNBR по типам покрова).

seed: 1234

data:
  # Как искать файлы чипа внутри каталога набора. Поиск рекурсивный по chip_id,
  # роль файла определяется по суффиксу имени (после chip_id).
  raster_extensions: [".tif", ".tiff", ".npy", ".npz"]
  af_roles:
    main: ["", "_af", "_viirs", "_img", "_bands"]     # I1..I5
    aux: ["_aux", "_extra", "_static", "_ancillary"]  # landcover, dem, углы, метео, valid
  bs_roles:
    pre: ["_pre", "_s2_pre", "_s2pre", "_optical_pre"]
    post: ["_post", "_s2_post", "_s2post", "_optical_post"]
    s1_pre: ["_s1_pre", "_s1pre", "_sar_pre"]
    s1_post: ["_s1_post", "_s1post", "_sar_post"]
    aux: ["_aux", "_extra", "_static", "_ancillary"]
  # Порядок каналов в файлах (индексация с 0), согласно постановке кейса.
  af_bands: {i1: 0, i2: 1, i3: 2, i4: 3, i5: 4}
  s2_bands: {b2: 0, b3: 1, b4: 2, b5: 3, b6: 4, b7: 5, b8a: 6, b11: 7, b12: 8, scl: 9}
  s1_bands: {vv: 0, vh: 1}
  # Каналы вспомогательного файла. Имена ищутся по описанию слоёв; если во
  # вспомогательном растре порядок другой, достаточно поправить этот блок.
  af_aux_bands: {landcover: 0, dem: 1, solar_zenith: 2, sensor_zenith: 3, t2m: 4, rh: 5, wind: 6, valid: 7}
  bs_aux_bands: {dem: 0, slope: 1, aspect: 2, landcover: 3}
  s2_scale: 10000.0   # L2A отражение хранится как uint16 ×10000
  s1_scale: 100.0     # sigma0 в дБ хранится как int16 ×100

# ---------------------------------------------------------------- модуль 1: AF
active_fire:
  window: 21                # размер окна контекстной статистики, пикселей
  min_bg_fraction: 0.15     # минимальная доля валидных фоновых пикселей в окне
  day_solar_zenith: 85.0    # граница «день/ночь» по зенитному углу Солнца, градусы
  saturation_i4: 367.0      # потолок канала I4, K (насыщение — сразу кандидат)
  # Абсолютные пороги: пиксель настолько горячий, что контекст уже не нужен.
  absolute:
    day: {i4: 340.0, dt: 25.0}
    night: {i4: 320.0, dt: 15.0}
  # Порог отбора кандидатов перед контекстным тестом (грубый, «широкий»).
  candidate:
    day: {i4: 312.0, dt: 8.0}
    night: {i4: 298.0, dt: 5.0}
  # Контекстный тест: превышение над фоном в единицах MAD и в кельвинах.
  context:
    i4_mad_k: 3.5
    i4_min_delta: 3.0
    dt_mad_k: 3.5
    dt_min_delta: 3.0
  # Фильтры источников ложных срабатываний.
  reject:
    glint_i3: 0.28          # SWIR-отражение выше — солнечный блик (вода, кровли, теплицы)
    glint_max_angle: 20.0   # угол зеркального отражения, градусы (если углы выданы)
    water_ndvi: 0.0         # NDVI ниже и низкий NIR — вода
    water_i2: 0.15
    bg_dt_std: 6.0          # разброс фоновой dT выше — край облака / дымовой шлейф
    cloud_i1: 0.30          # видимое отражение выше при умеренной dT — облако
    cloud_dt: 12.0
    builtup_dilate: 1       # радиус расширения маски застройки, пикселей
    technogenic_landcover: [50]        # WorldCover: застроенные территории
    suspicious_landcover: [50, 60, 80] # застройка, открытый грунт, вода
    suspicious_dt_margin: 6.0          # на этих классах требуем больший запас по dT
  min_cluster_size: 1       # минимальный размер связной области детекций, пикселей
  model:
    enabled: true           # при наличии весов решение принимает обученная модель
    path: "data/weights/af_model.joblib"
    threshold: 0.5

# ---------------------------------------------------------------- модуль 2: BS
burn_severity:
  # Группы типов покрова ESA WorldCover v200 и пороги dNBR для классов 1/2/3.
  # Лес и кустарник — шкала USGS; травяной покров, пашня, пойма — калибровка
  # по региону (значения из постановки кейса).
  landcover_groups:
    forest: [10, 20, 95]
    grass: [30, 100]
    crop: [40]
    wetland: [90, 95]
    other: [60, 70]
  thresholds:
    forest:  {t1: 0.100, t2: 0.270, t3: 0.660}
    grass:   {t1: 0.062, t2: 0.204, t3: 0.386}
    crop:    {t1: 0.070, t2: 0.177, t3: 0.380}
    wetland: {t1: 0.075, t2: 0.331, t3: 0.677}
    other:   {t1: 0.080, t2: 0.250, t3: 0.500}
    default: {t1: 0.080, t2: 0.250, t3: 0.500}
  # Подтверждение контура: гарь обязана показать падение NIR и рост SWIR,
  # иначе это фенология (уборка, вспашка) или ошибка атмосферной коррекции.
  confirm:
    min_dndvi: 0.03         # минимальное падение NDVI
    min_nbr_pre: -0.05      # была ли до пожара биомасса (NBR «до» выше порога)
    crop_extra_dnbr: 0.020  # на пашне требуем дополнительный запас по dNBR
    crop_min_dndvi: 0.08    # и более выраженное падение NDVI
  scl:
    invalid_classes: [0, 1, 3, 8, 9, 10, 11]  # нет данных, дефект, тень, облака, снег
    water_classes: [6]
  sar:
    enabled: true
    burn_dvh_db: -1.0       # падение VH (дБ) — признак утраты объёмного рассеяния
    recover_dvh_db: -1.8    # под облаком: такое падение само по себе считаем гарью
    recover_severity: 2     # класс, присваиваемый восстановленным по SAR пикселям
  morphology:
    min_object_px: 12       # мельче — спекл и одиночные ложные пиксели
    fill_holes_px: 24       # дыры меньше этой площади внутри контура заполняются
    smooth_iterations: 1    # одно открытие+закрытие для сглаживания края
  model:
    enabled: true
    path: "data/weights/bs_model.joblib"
    # Доля порога t1, начиная с которой пиксель передаётся модели. Ниже неё
    # падения NBR физически недостаточно для гари даже на самом бедном покрове.
    candidate_scale: 0.5

# ---------------------------------------------------------------- сервис
service:
  catalog_dir: "data/service_catalog"
  # Контуры мельче этого числа пикселей в векторный слой не попадают: на карте
  # они всё равно нечитаемы, а в справке дают шум в доли гектара.
  min_contour_px: 4
  host: "0.0.0.0"
  port: 8000
  max_features: 20000
