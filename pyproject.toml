[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firewatch"
version = "1.0.0"
description = "Двухэтапный мониторинг природных пожаров по данным ДЗЗ (VIIRS, Sentinel-2, Sentinel-1)"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "rasterio==1.4.4",
    "shapely==2.1.2",
    "PyYAML==6.0.1",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
