<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Смоук-тесты — спутниковая группировка</title>
<style>
body{font-family:ui-monospace,monospace;background:#0B1220;color:#E7EDF5;padding:20px;}
.pass{color:#57D68D;}
.fail{color:#E5637A;font-weight:bold;}
#summary{margin-top:16px;font-size:16px;}
li{margin-bottom:4px;}
</style>
</head>
<body>
<h1>Смоук-тесты расчётных модулей</h1>
<p>Открывается напрямую в браузере, без Node и без сборки. Проверяет геометрию, маршрутизацию, симуляцию и валидацию сценариев.</p>
<ul id="results"></ul>
<div id="summary"></div>

<script src="../js/geometry.js"></script>
<script src="../js/routing.js"></script>
<script src="../js/simulation.js"></script>
<script src="../js/validate.js"></script>
<script>
const results = document.getElementById('results');
let pass = 0, fail = 0;

function assert(name, cond, detail) {
  const li = document.createElement('li');
  if (cond) {
    pass++;
    li.className = 'pass';
    li.textContent = '✓ ' + name;
  } else {
    fail++;
    li.className = 'fail';
    li.textContent = '✗ ' + name + (detail ? ' — ' + detail : '');
  }
  results.appendChild(li);
}

function approx(a, b, eps) { return Math.abs(a - b) <= (eps ?? 1e-6); }

// --- Geometry ---
(function () {
  const sat = { u0: 0, raan: 0, inc: 86, id: 'T1' };
  const p0 = Geometry.satECI(sat, 0);
  assert('satECI: спутник на нулевом аргументе широты лежит в плоскости RAAN=0', approx(p0.y, 0, 1e-6) , `y=${p0.y}`);
  assert('satECI: высота орбиты соответствует R_E+550 км', approx(Math.hypot(p0.x, p0.y, p0.z), Geometry.R_E + 550, 1e-3), `r=${Math.hypot(p0.x,p0.y,p0.z)}`);

  const ecef = Geometry.eciToEcef(p0, 0);
  assert('eciToEcef: при t=0 поворот нулевой, ECI совпадает с ECEF', approx(ecef.x, p0.x) && approx(ecef.y, p0.y), JSON.stringify(ecef));

  const gsEcef = Geometry.geodeticToECEF(0, 0);
  assert('geodeticToECEF: точка на экваторе и нулевом меридиане лежит на оси X', approx(gsEcef.x, Geometry.R_E, 1e-6) && approx(gsEcef.y, 0, 1e-6) && approx(gsEcef.z, 0, 1e-6), JSON.stringify(gsEcef));

  const overhead = Geometry.elevationAngle(0, 0, { x: Geometry.R_E + 550, y: 0, z: 0 });
  assert('elevationAngle: спутник строго над пунктом даёт угол места 90°', approx(overhead.elevDeg, 90, 1e-3), `elev=${overhead.elevDeg}`);

  const farSide = Geometry.elevationAngle(0, 0, { x: -(Geometry.R_E + 550), y: 0, z: 0 });
  assert('elevationAngle: спутник на другой стороне Земли невидим (угол < 0)', farSide.elevDeg < 0, `elev=${farSide.elevDeg}`);

  const blockedThroughEarth = Geometry.segmentBlockedByEarth({ x: Geometry.R_E + 550, y: 0, z: 0 }, { x: -(Geometry.R_E + 550), y: 0, z: 0 });
  assert('segmentBlockedByEarth: отрезок через центр Земли считается заблокированным', blockedThroughEarth === true);

  const notBlocked = Geometry.segmentBlockedByEarth({ x: Geometry.R_E + 550, y: 0, z: 0 }, { x: Geometry.R_E + 550, y: 500, z: 0 });
  assert('segmentBlockedByEarth: близкий боковой отрезок не заблокирован', notBlocked === false);
})();

// --- Simulation: generateSatellites ---
(function () {
  const cfg = Simulation.DEFAULT_CONFIG();
  const sats = Simulation.generateSatellites(cfg);
  assert('generateSatellites: полная группировка даёт 48 спутников', sats.length === 48, `len=${sats.length}`);

  const cfg1 = { ...cfg, activePlanes: [1] };
  const sats1 = Simulation.generateSatellites(cfg1);
  assert('generateSatellites: одна очередь даёт 16 спутников', sats1.length === 16, `len=${sats1.length}`);

  const cfgCustom = { ...cfg, customPlanes: [{ id: 1, raan: 0, inclination: 86, satellites: 0 }] };
  const satsCustom = Simulation.generateSatellites(cfgCustom);
  assert('generateSatellites: 0 спутников в плоскости не роняет расчёт (защита от деления на 0)', satsCustom.length === 0, `len=${satsCustom.length}`);
})();

// --- Routing ---
(function () {
  const config = {
    groundStations: [
      { name: 'A', lat: 60, lon: 30, gateway: false },
      { name: 'GW', lat: 55, lon: 37, gateway: true }
    ]
  };
  const step = {
    gwDown: false,
    gsVis: { A: [{ satId: 'S1', elevDeg: 45 }], GW: [{ satId: 'S2', elevDeg: 45 }] },
    islEdges: [['S1', 'S2', 1000]]
  };
  const route = Routing.computeRoute('A', step, config);
  assert('computeRoute: находит маршрут через цепочку S1→S2 (2 хопа)', route.ok === true && route.hops === 2 && route.path.join(',') === 'A,S1,S2,GW', JSON.stringify(route));

  const noGwVisStep = { gwDown: false, gsVis: { A: [{ satId: 'S1', elevDeg: 45 }], GW: [] }, islEdges: [] };
  const r2 = Routing.computeRoute('A', noGwVisStep, config);
  assert('computeRoute: причина "no_gateway_contact" при отсутствии видимости шлюза', r2.ok === false && r2.reason === 'no_gateway_contact', JSON.stringify(r2));

  const noVisStep = { gwDown: false, gsVis: { A: [], GW: [{ satId: 'S2', elevDeg: 45 }] }, islEdges: [] };
  const r3 = Routing.computeRoute('A', noVisStep, config);
  assert('computeRoute: причина "no_visible_sat" при отсутствии видимого спутника над пунктом', r3.ok === false && r3.reason === 'no_visible_sat', JSON.stringify(r3));

  const brokenIslStep = { gwDown: false, gsVis: { A: [{ satId: 'S1', elevDeg: 45 }], GW: [{ satId: 'S2', elevDeg: 45 }] }, islEdges: [] };
  const r4 = Routing.computeRoute('A', brokenIslStep, config);
  assert('computeRoute: причина "isl_break" при разрыве МСС-сети', r4.ok === false && r4.reason === 'isl_break', JSON.stringify(r4));

  const gwDownStep = { gwDown: true, gsVis: {}, islEdges: [] };
  const r5 = Routing.computeRoute('A', gwDownStep, config);
  assert('computeRoute: причина "gateway_down" при плановом перерыве на шлюзе', r5.ok === false && r5.reason === 'gateway_down', JSON.stringify(r5));
})();

// --- Simulation: end-to-end ---
(function () {
  const cfg = Simulation.DEFAULT_CONFIG();
  cfg.durationHours = 1;
  cfg.stepSeconds = 300;
  let metrics;
  try {
    metrics = Simulation.simulateVariant(cfg);
    assert('simulateVariant: считает вариант без исключений', true);
  } catch (e) {
    assert('simulateVariant: считает вариант без исключений', false, e.message);
  }
  if (metrics) {
    assert('simulateVariant: возвращает метрики для всех негейтвей-пунктов', Object.keys(metrics.perGs).length === 5, `count=${Object.keys(metrics.perGs).length}`);
    assert('simulateVariant: overallAvailability в диапазоне [0,100]', metrics.overallAvailability >= 0 && metrics.overallAvailability <= 100, `${metrics.overallAvailability}`);
  }

  const badCfg = { ...cfg, durationHours: -1 };
  let threw = false;
  try { Simulation.simulateVariant(badCfg); } catch (e) { threw = true; }
  assert('simulateVariant: выбрасывает понятную ошибку при некорректной durationHours (а не тихо ломается)', threw === true);

  const recommended = Simulation.DEFAULT_CONFIG();
  recommended.minElevationDeg = 5;
  const recMetrics = Simulation.simulateVariant(recommended);
  const minAvail = Math.min(...Object.values(recMetrics.perGs).map(m => m.availability));
  assert('Рекомендованный вариант (minElevationDeg=5) достигает >=90% для всех пунктов за сутки', minAvail >= 90, `min=${minAvail.toFixed(1)}%`);
})();

// --- Validate ---
(function () {
  const valid = {
    ground_stations: [
      { name: 'A', lat: 60, lon: 30, gateway: false },
      { name: 'GW', lat: 55, lon: 37, gateway: true }
    ],
    planes: [{ raan: 0, inclination: 86, satellites: 16 }],
    isl_max_range_km: 3000
  };
  assert('validateScenario: корректный сценарий не даёт ошибок', Validate.validateScenario(valid).length === 0, JSON.stringify(Validate.validateScenario(valid)));

  assert('validateScenario: null не является объектом сценария', Validate.validateScenario(null).length > 0);

  const noGateway = { ...valid, ground_stations: [{ name: 'A', lat: 60, lon: 30, gateway: false }, { name: 'B', lat: 61, lon: 31, gateway: false }] };
  assert('validateScenario: требует хотя бы один шлюз', Validate.validateScenario(noGateway).some(e => e.includes('gateway')));

  const badStepType = { ...valid, step_seconds: '120' };
  assert('validateScenario: отклоняет step_seconds строкового типа', Validate.validateScenario(badStepType).some(e => e.includes('step_seconds')));

  const negativeDuration = { ...valid, duration_hours: -5 };
  assert('validateScenario: отклоняет отрицательный duration_hours', Validate.validateScenario(negativeDuration).some(e => e.includes('duration_hours')));

  const badOutage = { ...valid, outages: [{ type: 'satellite', id: 'X', start_hour: 5, end_hour: 2 }] };
  assert('validateScenario: отклоняет outage с end_hour <= start_hour', Validate.validateScenario(badOutage).some(e => e.includes('end_hour')));
})();

// --- configToScenario: цикл «выгрузить → загрузить» ---
(function () {
  // Повторяет маппинг загрузчика (handleFileUpload) — сценарий → внутренний config.
  function loadScenarioToConfig(obj) {
    return {
      ...Simulation.DEFAULT_CONFIG(),
      groundStations: obj.ground_stations.map(g => ({ name: g.name, lat: g.lat, lon: g.lon, gateway: !!g.gateway })),
      customPlanes: obj.planes.map((p, i) => ({ id: (p.id != null ? p.id : i + 1), raan: p.raan, inclination: p.inclination, satellites: p.satellites, phase_offset: p.phase_offset || 0 })),
      islMaxRangeKm: obj.isl_max_range_km ?? 3000,
      minElevationDeg: obj.min_elevation_deg ?? 10,
      durationHours: Math.min(72, obj.duration_hours ?? 24),
      stepSeconds: Math.max(30, obj.step_seconds ?? 120),
      outages: (obj.outages || []).map(o => ({ type: o.type, id: o.id, startHour: o.start_hour, endHour: o.end_hour })),
      activePlanes: [1, 2, 3]
    };
  }

  const cfg = Simulation.DEFAULT_CONFIG();
  const scenario = Simulation.configToScenario(cfg, 'Тест');
  assert('configToScenario: результат проходит валидацию как сценарий', Validate.validateScenario(scenario).length === 0, JSON.stringify(Validate.validateScenario(scenario)));

  const idsBefore = Simulation.generateSatellites(cfg).map(s => s.id).sort().join(',');
  const idsAfter = Simulation.generateSatellites(loadScenarioToConfig(scenario)).map(s => s.id).sort().join(',');
  assert('configToScenario: round-trip сохраняет полный набор id спутников', idsBefore === idsAfter);

  // Частичная очередь + отказ на плоскости 3 — проверяем, что id плоскостей не «поехали».
  const partial = { ...Simulation.DEFAULT_CONFIG(), activePlanes: [2, 3], outages: [{ type: 'satellite', id: 'P3-S5', startHour: 0, endHour: 24 }] };
  const partScenario = Simulation.configToScenario(partial, 'Частичная');
  const reloaded = loadScenarioToConfig(partScenario);
  const reloadedIds = new Set(Simulation.generateSatellites(reloaded).map(s => s.id));
  assert('configToScenario: id плоскостей сохраняются (P2-*/P3-*, а не переиндексируются)', reloadedIds.has('P2-S1') && reloadedIds.has('P3-S16'));
  assert('configToScenario: ссылка отказа (P3-S5) остаётся валидной после round-trip', reloadedIds.has(reloaded.outages[0].id) && reloaded.outages[0].id === 'P3-S5');

  const scenWithId = { ...scenario, planes: scenario.planes.map(p => ({ ...p, id: p.id })) };
  assert('validateScenario: принимает необязательное поле "id" у плоскости', Validate.validateScenario(scenWithId).length === 0);
})();

document.getElementById('summary').innerHTML =
  `<b>${pass} пройдено, ${fail} провалено</b>` + (fail === 0 ? ' — <span class="pass">все тесты зелёные ✓</span>' : ' — <span class="fail">есть проваленные тесты</span>');
</script>
</body>
</html>
