<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Интеграционные тесты — драйвим реальное приложение</title>
<style>
body{font-family:ui-monospace,monospace;background:#1c1c1c;color:#e6e6e6;padding:18px;margin:0;}
.pass{color:#7ac25a;} .fail{color:#e0645f;font-weight:bold;}
#summary{margin:14px 0;font-size:16px;}
li{margin-bottom:3px;list-style:none;}
ul{padding-left:0;}
h2{font-size:14px;color:#9a9a9a;margin:14px 0 6px;text-transform:uppercase;}
iframe{width:1200px;height:700px;border:1px solid #333;margin-top:10px;background:#111;}
</style>
</head>
<body>
<h1>Интеграционные тесты приложения</h1>
<p>Загружает реальный <code>../index.html</code> в iframe и прогоняет базовые сценарии проверки из ТЗ
и краевые случаи, проверяя фактический DOM. Открывать через веб-сервер или файлом — работает и так, и так
(файлы не загружаются из сети, сценарии строятся в памяти).</p>
<div id="summary">Выполняется…</div>
<ul id="results"></ul>
<iframe id="app" src="../index.html"></iframe>

<script>
const results = document.getElementById('results');
let pass = 0, fail = 0;
function section(t){ const h=document.createElement('h2'); h.textContent=t; results.appendChild(h); }
function assert(name, cond, detail){
  const li=document.createElement('li');
  if(cond){ pass++; li.className='pass'; li.textContent='✓ '+name; }
  else { fail++; li.className='fail'; li.textContent='✗ '+name+(detail?' — '+detail:''); }
  results.appendChild(li);
}
function loadFile(win, doc, obj){
  win.FileReader = class { readAsText(file){ this.onload({target:{result:file.__text}}); } };
  win.handleFileUpload({ target: { files: [ { __text: JSON.stringify(obj) } ] } });
}
function lastAvail(doc){
  const rows=[...doc.querySelectorAll('.variantRow .stat')];
  if(!rows.length) return null;
  const m=rows[rows.length-1].textContent.match(/([\d.]+)%/);
  return m?parseFloat(m[1]):null;
}
function routeSat(doc){
  const m=doc.getElementById('routeBox').textContent.match(/→\s*(P\d+-S\d+)\s*→/);
  return m?m[1]:null;
}

function run(){
  const iframe=document.getElementById('app');
  const win=iframe.contentWindow, doc=iframe.contentDocument;
  let jsError=null;
  win.onerror=(m)=>{ jsError=m; };

  // ---- Базовый сценарий 1: Полная группировка ----
  section('Базовый сценарий 1 — Полная группировка');
  win.applyPreset('full'); win.runCalculation();
  const fullAvail=lastAvail(doc);
  assert('Полная группировка рассчитывается, доступность в разумных пределах (60–90%)', fullAvail!==null && fullAvail>60 && fullAvail<90, 'avail='+fullAvail);
  win.onTimeChange(50); const r50=doc.getElementById('routeBox').textContent;
  win.onTimeChange(300); const r300=doc.getElementById('routeBox').textContent;
  assert('Маршрут пересчитывается при смене момента времени (t=50 ≠ t=300 в общем случае)', r50!==r300 || /Маршрут/.test(r50), 'route меняется');
  assert('Панель пункта показывает 4 плитки статистики', doc.querySelectorAll('#gsStats .stat-tile').length===4);

  // ---- Базовый сценарий 2: Этап развёртывания ----
  section('Базовый сценарий 2 — Этап развёртывания (очередь 3 → 1)');
  win.applyPreset('phase1'); win.runCalculation();
  const p1Avail=lastAvail(doc);
  assert('Первая очередь (16 КА) рассчитывается', p1Avail!==null, 'avail='+p1Avail);
  assert('Доступность 1-й очереди ниже полной группировки', p1Avail<fullAvail, `${p1Avail} < ${fullAvail}`);
  // сравнение двух вариантов + diff параметров
  const boxes=[...doc.querySelectorAll('[data-compare]')];
  boxes.forEach(b=>{ if(!b.checked){ b.checked=true; b.onchange&&b.onchange(); }});
  win.onCompareToggle();
  const cmpText=doc.getElementById('compareArea').textContent;
  assert('Сравнение показывает секцию «Параметры конфигурации»', /Параметры конфигурации/.test(cmpText));
  assert('Сравнение показывает число спутников 48 и 16', /48/.test(cmpText)&&/16/.test(cmpText));
  assert('В сравнении есть подсвеченные отличия (класс diff)', doc.querySelectorAll('#compareArea td.diff').length>0);

  // ---- Базовый сценарий 3: Отказ аппарата ----
  section('Базовый сценарий 3 — Отказ аппарата / шлюза');
  win.applyPreset('recommended'); win.runCalculation();
  const recAvail=lastAvail(doc);
  assert('Рекомендованный вариант достигает ≥90%', recAvail>=90, 'avail='+recAvail);
  assert('Бейдж «цель 90% достигнута» присутствует', /цель 90% достигнута/.test(doc.getElementById('variantsList').textContent));
  // Ищем момент, когда у пункта ЕСТЬ маршрут (при 92% доступности часть шагов — перерывы).
  let sat=null;
  for(let t=0;t<400 && !sat;t+=5){ win.onTimeChange(t); sat=routeSat(doc); }
  assert('Найден момент с маршрутом и из него извлекается обслуживающий спутник', !!sat, 'sat='+sat);
  // И наоборот: должен существовать момент-перерыв, где маршрута нет (диаграмма показывает перерывы).
  let hadGap=false;
  for(let t=0;t<400 && !hadGap;t+=1){ win.onTimeChange(t); if(!routeSat(doc) && /route fail|Нет|Отсутствует|Разрыв|недоступ/i.test(doc.getElementById('routeBox').className+doc.getElementById('routeBox').textContent)) hadGap=true; }
  assert('Существует момент-перерыв, где маршрут отсутствует (с указанием причины)', hadGap);
  // выбираем спутник и задаём отказ на все сутки — как в сценарии проверки
  if(sat){
    doc.getElementById('outageSatSelect').value=sat;
    doc.getElementById('outStart').value=0; doc.getElementById('outEnd').value=24;
    const before=doc.querySelectorAll('#outageList .outageRow').length;
    win.addSatOutage();
    assert('Отказ спутника добавляется в список', doc.querySelectorAll('#outageList .outageRow').length===before+1);
  }
  // плановый перерыв на шлюзе 0–6 ч → детерминированное падение доступности
  win.applyPreset('recommended');
  doc.getElementById('gwOutageChk').checked=true; win.toggleGwOutage();
  win.runCalculation();
  const gwAvail=lastAvail(doc);
  assert('Перерыв на шлюзе заметно снижает доступность (реакция на отказ)', gwAvail<recAvail-5, `${gwAvail} << ${recAvail}`);

  // ---- Базовый сценарий 4: Изменение проекта + сохранение/сравнение ----
  section('Базовый сценарий 4 — Изменение проекта');
  win.resetDraft();
  win.setRaanOffset(0,40); win.setPhaseOffset(0,10);
  doc.getElementById('variantName').value='Изменённый';
  win.runCalculation();
  assert('Изменённый вариант сохраняется в список', /Изменённый/.test(doc.getElementById('variantsList').textContent));

  // ---- Загрузка файлов: корректный / битый / обёрнутый ----
  section('Загрузка сценариев (валидация и round-trip)');
  const validScenario={
    name:'IT-валидный',
    ground_stations:[{name:'A',lat:60,lon:30,gateway:false},{name:'GW',lat:55,lon:37,gateway:true}],
    planes:[{id:1,raan:0,inclination:86,satellites:16,phase_offset:0}],
    isl_max_range_km:3000, min_elevation_deg:8, duration_hours:6, step_seconds:120
  };
  loadFile(win,doc,validScenario);
  assert('Корректный сценарий загружается (сообщение об успехе)', /загружен и прошёл проверку/.test(doc.getElementById('fileMsg').textContent));
  assert('Форма переходит в режим загруженного сценария (плоскости из файла)', /заданы загруженным сценарием/.test(doc.getElementById('planeSliders').textContent));
  win.runCalculation();
  assert('Загруженный сценарий рассчитывается без ошибок', lastAvail(doc)!==null && !/Не удалось/.test(doc.getElementById('calcMsg').textContent));

  loadFile(win,doc,{planes:[]});
  assert('Битый файл (нет ground_stations, пустые planes) → показаны ошибки', /Файл содержит ошибки/.test(doc.getElementById('fileMsg').textContent));

  const wrapped={name:'IT-обёрнутый', config: win.Simulation.configToScenario ? null : null };
  // строим обёрнутый экспорт из валидного сценария через loadScenario→configToScenario недоступен (config приватный);
  // используем публичный configToScenario на конфиге, собранном из DEFAULT_CONFIG
  const cfg=win.Simulation.DEFAULT_CONFIG(); cfg.customPlanes=[{id:1,raan:10,inclination:86,satellites:16,phase_offset:0}];
  loadFile(win,doc,{name:'IT-обёрнутый', config:cfg, metrics:{}});
  assert('Обёрнутый экспорт результатов ({config}) тоже загружается', /загружен и прошёл проверку/.test(doc.getElementById('fileMsg').textContent));

  // ---- Краевой случай: нестандартные длительность/шаг и диапазон таймлайна ----
  section('Краевые случаи');
  win.resetDraft();
  win.onDurationChange(6); win.onStepChange(60); // 6ч/60с = 360 шагов
  win.runCalculation();
  const slider=doc.getElementById('timeSlider');
  assert('Диапазон таймлайна соответствует нестандартным длительности/шагу (max=359)', Number(slider.max)===359, 'max='+slider.max);

  win.applyPreset('isl2000'); win.runCalculation();
  assert('Пресет МСС≤2000 км считается без ошибок', lastAvail(doc)!==null);
  win.applyPreset('degraded');
  assert('Пресет «отказ 10 аппаратов» задаёт 10 периодов недоступности', doc.querySelectorAll('#outageList .outageRow').length===10, 'rows='+doc.querySelectorAll('#outageList .outageRow').length);
  win.runCalculation();
  assert('Деградированный сценарий считается без ошибок', lastAvail(doc)!==null);

  // ---- Режимы карты и наличие обработчиков ----
  section('Карта и API');
  win.setMapMode('grid');
  assert('Переключение в режим «Схема» отмечает кнопку', doc.getElementById('modeGrid').classList.contains('sel'));
  win.setMapMode('map');
  assert('Переключение в режим «Карта» отмечает кнопку', doc.getElementById('modeMap').classList.contains('sel'));
  assert('Данные континентов загружены (COASTLINES)', Array.isArray(win.COASTLINES) && win.COASTLINES.length>10, 'rings='+(win.COASTLINES||[]).length);
  ['applyPreset','runCalculation','handleFileUpload','exportScenario','exportVariant','exportDraftScenario','setMapMode','togglePlay','runVulnerabilityScan','runAutoTune','addSatOutage']
    .forEach(fn=>assert('Публичная функция определена: '+fn, typeof win[fn]==='function'));

  // ---- Доп. функции (на лёгком конфиге, чтобы быстро) ----
  section('Доп. функции сценарного анализа');
  const smallCfg=win.Simulation.DEFAULT_CONFIG(); smallCfg.durationHours=2; smallCfg.stepSeconds=600;
  const vuln=win.Simulation.findVulnerableSatellites(smallCfg,{topN:5});
  assert('Поиск уязвимых КА возвращает ранжированный топ-5', Array.isArray(vuln.ranked)&&vuln.ranked.length===5);
  assert('У каждого КА есть падение доступности (число) и итоговая доступность', vuln.ranked.every(r=>typeof r.availabilityDrop==='number'&&typeof r.overallAvailability==='number'));
  assert('Ранжирование по убыванию падения доступности', vuln.ranked.every((r,i)=>i===0||vuln.ranked[i-1].availabilityDrop>=r.availabilityDrop));
  const tuned=win.Simulation.autoTuneConfig(smallCfg,{raanGrid:[0],phaseGrid:[0],islGrid:[3000],elevGrid:[10,5]});
  assert('Автоподбор возвращает вариант с числовой минимальной доступностью', tuned&&typeof tuned.minAvail==='number');
  assert('Автоподбор выбирает порог угла места из заданной сетки', tuned&&[10,5].includes(tuned.minElevationDeg));

  // ---- Итог: отсутствие JS-ошибок ----
  section('Стабильность');
  assert('За весь прогон не возникло необработанных JS-ошибок', jsError===null, jsError||'');

  document.getElementById('summary').innerHTML =
    `<b>${pass} пройдено, ${fail} провалено</b>` + (fail===0?' — <span class="pass">всё зелёное ✓</span>':' — <span class="fail">есть провалы</span>');
  document.title = (fail===0?'INTEGRATION_OK ':'INTEGRATION_FAIL ')+pass+'/'+(pass+fail);
}
document.getElementById('app').addEventListener('load', ()=>{ try{ run(); }catch(e){ assert('Прогон без исключений в самом тесте', false, e.message+' '+e.stack); document.getElementById('summary').textContent='ОШИБКА ТЕСТА: '+e.message; } });
</script>
</body>
</html>
